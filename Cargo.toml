[package]
name = "drf-toon-native"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
path = "rust/lib.rs"

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order", "arbitrary_precision"] }
toon-format = { version = "0.7.0", default-features = false }
